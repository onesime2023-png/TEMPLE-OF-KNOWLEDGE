<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temple of Knowledge | Academic Evaluation</title><link rel="stylesheet" href="./css/style.css"></head>
<body><header class="topbar"><div class="brand"><span class="mark">TK</span><div><b>TEMPLE OF KNOWLEDGE</b><small>Academic Evaluation System</small></div></div><button id="logout" class="secondary hidden">Sign out</button></header>
<main class="container">
<section id="login" class="auth panel"><p class="eyebrow">ACADEMY PORTAL</p><h1>Welcome back</h1><p class="muted">Sign in with your academy account.</p>
<form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button><p id="loginError" class="error"></p></form></section>
<section id="app" class="hidden"><div class="welcome"><div><p class="eyebrow">ACADEMY WORKSPACE</p><h1 id="welcomeName">Dashboard</h1><p id="welcomeEmail" class="muted"></p></div><span id="role" class="pill"></span></div>
<div id="cards" class="cards"></div><section id="workspace" class="panel"><h2>Workspace</h2><p class="muted">Choose a module above.</p></section></section></main>
<footer>© <span id="year"></span> Temple of Knowledge Academy</footer><script type="module" src="./js/app.js"></script></body></html>
